spring.application.name=EmployeeShiftManagement

# Database credentials are NOT kept in version control.
# Copy application-local.properties.example (in the backend/ folder) to
# application-local.properties and put your real MySQL username/password there.
# That file is gitignored. Both paths below are tried, so it works whether you
# run from backend/ or from the repository root.
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/employee_shift_db?useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
